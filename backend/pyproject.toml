[project]
name = "palm-backend"
version = "0.1.0"
description = "Palm reading API (local dev skeleton)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
